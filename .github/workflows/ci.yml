name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22.23.4', '24.22.1', '26.12.1']
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (Biome)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Server test typecheck
        run: pnpm typecheck:tests

      - name: CLI Typecheck
        run: pnpm -C cli typecheck

      - name: CLI Test
        run: pnpm -C cli test

      - name: Script Test
        run: pnpm test:scripts

      - name: Test
        run: pnpm test

      - name: Client Test (jsdom)
        run: pnpm test:client

      - name: Build
        run: pnpm build

      - name: CLI Build
        run: pnpm -C cli build

      - name: Schema drift check (nanoka + drizzle)
        run: |
          pnpm db:generate
          if [ -n "$(git status --porcelain -- drizzle)" ]; then
            echo "::error::drizzle/ is out of date. Run 'pnpm db:generate' and commit the result."
            git status --porcelain -- drizzle
            git --no-pager diff -- drizzle
            exit 1
          fi
