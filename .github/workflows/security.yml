name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Sunday 23:17 Asia/Tokyo; GitHub schedules may be delayed.
    - cron: '17 14 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      npm_config_ignore_scripts: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.2
          run_install: false
      # Audit the committed lockfile without installing or executing project code.
      - name: Audit dependencies and classify the result
        shell: bash
        run: |
          set +e
          pnpm audit --audit-level=low --json --registry=https://registry.npmjs.org > "$RUNNER_TEMP/dependency-audit.json"
          audit_status=$?
          set -e
          export AUDIT_STATUS="$audit_status"
          node <<'NODE'
          const fs = require('node:fs');
          const fail = (message) => {
            console.error(`::error title=Dependency audit could not complete::${message}`);
            process.exit(1);
          };
          let report;
          try {
            report = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/dependency-audit.json`, 'utf8'));
          } catch {
            fail('No valid audit report. Check the registry/network and audit command.');
          }
          const counts = report.metadata?.vulnerabilities;
          const levels = ['info', 'low', 'moderate', 'high', 'critical'];
          if (report.error || !counts || levels.some((level) => !Number.isInteger(counts[level]) || counts[level] < 0)) {
            fail('The audit returned an error or an unsupported report format.');
          }
          const summary = levels.map((level) => `${level}: ${counts[level]}`).join(', ');
          console.log(summary);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## Dependency audit\n${summary}\n`);
          // Print advisory details only after validating this is a vulnerability report.
          console.log(JSON.stringify(report.advisories ?? report.vulnerabilities ?? {}, null, 2));
          if (levels.slice(1).some((level) => counts[level] > 0)) {
            console.error('::error title=Dependency vulnerabilities detected::Review the advisory details above.');
            process.exit(1);
          }
          if (process.env.AUDIT_STATUS !== '0') {
            fail('The audit command exited unsuccessfully without a vulnerability finding.');
          }
          NODE

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - name: Analyze and upload results
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:${{ matrix.language }}
          upload-database: false
